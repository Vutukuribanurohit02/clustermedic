global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9400"]
  # ClusterMedic service running on the host (WSL): cluster health + KPIs
  - job_name: clustermedic
    scrape_timeout: 10s
    static_configs:
      - targets: ["host.docker.internal:9500"]
