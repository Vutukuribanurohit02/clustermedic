name: clustermedic

services:
  redfish:
    image: dmtf/redfish-mockup-server:latest
    container_name: redfish
    command: ["-H", "0.0.0.0", "-p", "8000", "-D", "/mockup", "-S"]
    volumes:
      - ./infra/redfish/mockups/public-rackmount1:/mockup
    ports: ["8000:8000"]
    networks: [clusternet]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports: ["9100:9100"]
    networks: [clusternet]
    restart: unless-stopped

  gpu-exporter:
    build: ./infra/gpu-exporter
    container_name: gpu-exporter
    volumes:
      - ./infra/gpu-exporter/state:/state
    ports: ["9400:9400"]
    networks: [clusternet]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    networks: [clusternet]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]
    networks: [clusternet]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    networks: [clusternet]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  clusternet:
    name: slurm_slurm-network
    external: true
